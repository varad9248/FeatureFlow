name: FeatureFlow CI/CD Pipeline

# Triggers
on:
  push:
    branches: [main]        # deploy on push to main
  pull_request:
    branches: [main]        # only test on PR, don't deploy

permissions:
  contents: read

jobs:

  # JOB 1: TEST (runs on both PR and push)
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest

    steps:
      # Step 1 - Get the code from GitHub
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68  # v4.2.2

      # Step 2 - Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af  # v4.1.0
        with:
          node-version: '20'

      # Step 3 - Install backend dependencies
      - name: Install backend dependencies
        working-directory: ./backend
        run: npm ci

      # Step 4 - Run backend tests ✅ THIS WAS MISSING - BUG FIXED!
      - name: Run backend tests
        working-directory: ./backend
        run: npm test
        env:
          SUPABASE_URL: https://fake-test-url.supabase.co
          SUPABASE_ANON_KEY: fake-test-key-for-testing-only
          UPSTASH_REDIS_REST_URL: https://fake-redis.upstash.io
          UPSTASH_REDIS_REST_TOKEN: fake-redis-token
          DATABASE_URL: postgres://fake:fake@localhost:5432/fakedb

      # Step 5 - Install frontend dependencies
      - name: Install frontend dependencies
        working-directory: ./frontend
        run: npm ci

      # Step 6 - Build frontend (catch any errors)
      - name: Build frontend
        working-directory: ./frontend
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}

  # JOB 2: DEPLOY BACKEND (only on push to main)
  deploy-backend:
    name: Deploy Backend to Render
    runs-on: ubuntu-latest
    needs: test                  # only run if test job passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1 - Get the code
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68  # v4.2.2

      # Step 2 - Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567  # v3.3.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step 3 - Build and push Docker image
      - name: Build and push backend image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75  # v6.9.0
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/featureflow-backend:latest

      # Step 4 - Tell Render to deploy new image
      - name: Trigger Render Deploy
        run: |
          curl --fail -X POST \
            "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
            -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
            -H "Content-Type: application/json"

      # Step 5 - Health check (wait for Render to wake up)
      - name: Health Check
        run: |
          echo "Waiting for deployment to be ready..."
          sleep 60
          curl --fail ${{ secrets.RENDER_BACKEND_URL }}/health || exit 1

  # JOB 3: DEPLOY FRONTEND (only on push to main)
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: test                  # only run if test job passed
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # Step 1 - Get the code
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af68  # v4.2.2

      # Step 2 - Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel@39.1.0

      # Step 3 - Deploy to Vercel
      - name: Deploy to Vercel
        run: |
          vercel deploy --prod \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --yes
        working-directory: ./frontend
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
```

